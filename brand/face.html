<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trustset mark refinement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;background:#1a1a1a;color:#eee;font-family:"DM Mono",monospace;padding:26px}
  h1{font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#999;margin:0 0 14px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .cell{border-radius:12px;overflow:hidden}
  .d{background:#0b0c0a;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .l{background:#f4f3ee;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .n{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase}
  .d .n{color:rgba(242,241,236,.55)} .l .n{color:rgba(17,18,16,.55)}
  .cap{font-size:11px;line-height:1.4;text-align:center;max-width:26ch}
  .d .cap{color:rgba(242,241,236,.7)} .l .cap{color:rgba(17,18,16,.7)}
  .d svg{--fg:#f2f1ec;--acc:#ff6a3d;--bg:#0b0c0a} .l svg{--fg:#111210;--acc:#e8552b;--bg:#f4f3ee}
  .big{width:72px;height:72px}
  .sizes{display:flex;gap:12px;align-items:flex-end}
  .sizes svg{display:block}
  .lock{display:flex;gap:10px;align-items:center;font-size:19px;letter-spacing:-.4px}
  .lock svg{width:24px;height:24px}
  .d .lock{color:#f2f1ec} .l .lock{color:#111210}
  .states{display:flex;gap:16px;align-items:center;font-size:10px}
  .states svg{width:28px;height:28px}
  .d .states{color:rgba(242,241,236,.5)} .l .states{color:rgba(17,18,16,.5)}
</style>
</head>
<body>
<h1>the face. top bar, two eyes, bottom bar. eight refinements, each at 72, 32, 20 and 16 px, with a lockup.</h1>
<div class="row" id="a"></div>
<div class="row" id="b"></div>
<script>
// geometry helpers on a 48 grid
const face = ({bar=6, eye=8, gapX=8, top=9, eyeY=20, bottom=33, w=30, x=9, eyes='var(--acc)', fg='var(--fg)', rx=0, eyeRx=0}) => {
  const eyeW = (w - gapX) / 2;
  return `<svg viewBox="0 0 48 48"><rect x="${x}" y="${top}" width="${w}" height="${bar}" rx="${rx}" fill="${fg}"/><rect x="${x}" y="${eyeY}" width="${eyeW}" height="${eye}" rx="${eyeRx}" fill="${eyes}"/><rect x="${x+eyeW+gapX}" y="${eyeY}" width="${eyeW}" height="${eye}" rx="${eyeRx}" fill="${eyes}"/><rect x="${x}" y="${bottom}" width="${w}" height="${bar}" rx="${rx}" fill="${fg}"/></svg>`;
};
const v = [
  {n:'f1 as picked', cap:'5.8 tripped, unchanged. eyes orange at rest', m: face({})},
  {n:'f2 wider gap', cap:'eyes further apart, more face, less menu', m: face({gapX:12, eye:8})},
  {n:'f3 heavier eyes', cap:'eyes taller than the bars. the eyes are the point', m: face({eye:10, eyeY:19, bar:5, top:9, bottom:34})},
  {n:'f4 soft', cap:'1.5 radius on every block. friendlier, still square', m: face({rx:1.5, eyeRx:1.5, gapX:10})},
  {n:'f5 eyes in text', cap:'monochrome at rest. orange eyes only when tripped', m: face({eyes:'var(--fg)', gapX:10}), trip: face({gapX:10})},
  {n:'f6 wink', cap:'one eye a dot. reads as a face and a switch state', m: `<svg viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="6" fill="var(--fg)"/><rect x="9" y="20" width="10" height="8" fill="var(--acc)"/><rect x="29" y="20" width="10" height="8" fill="var(--acc)"/><rect x="9" y="33" width="30" height="6" fill="var(--fg)"/></svg>`.replace('width="10" height="8" fill="var(--acc)"/><rect x="29"','width="10" height="8" fill="var(--acc)"/><rect x="31" y="20" width="8"')},
  {n:'f7 tile', cap:'on a text colour tile, eyes in orange, bars in ground colour', m: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="var(--fg)"/><rect x="12" y="13" width="24" height="5" fill="var(--bg)"/><rect x="12" y="22" width="9" height="6" fill="var(--acc)"/><rect x="27" y="22" width="9" height="6" fill="var(--acc)"/><rect x="12" y="32" width="24" height="5" fill="var(--bg)"/></svg>`},
  {n:'f8 orange tile', cap:'on an orange tile, all ink. the loud card mark', m: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="var(--acc)"/><rect x="12" y="13" width="24" height="5" fill="#160a06"/><rect x="12" y="22" width="9" height="6" fill="#160a06"/><rect x="27" y="22" width="9" height="6" fill="#160a06"/><rect x="12" y="32" width="24" height="5" fill="#160a06"/></svg>`},
];
const sz = m => `<div class="sizes">${[32,20,16].map(s=>`<span style="width:${s}px;height:${s}px;display:block">${m}</span>`).join('')}</div>`;
const cell = m => `<div class="cell">
  <div class="d"><div class="n">${m.n}</div><div class="big">${m.m}</div>${sz(m.m)}<div class="lock">${m.m}trustset</div>${m.trip?`<div class="states">${m.m}<span>rest</span>${m.trip}<span>tripped</span></div>`:''}<div class="cap">${m.cap}</div></div>
  <div class="l"><div class="big">${m.m}</div>${sz(m.m)}<div class="lock">${m.m}trustset</div>${m.trip?`<div class="states">${m.m}<span>rest</span>${m.trip}<span>tripped</span></div>`:''}</div>
</div>`;
document.getElementById('a').innerHTML = v.slice(0,4).map(cell).join('');
document.getElementById('b').innerHTML = v.slice(4).map(cell).join('');
</script>
</body>
</html>
