[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 512 }
# only what the scripts and tests touch. the whole repo was read-write, so any
# script, test or vendored library could read .deployer.json or agent/silk.env.
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./demo" },
  { access = "read", path = "./test" },
]

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"
